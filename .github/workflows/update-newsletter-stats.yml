name: Update Newsletter Subscriber Counts

on:
  schedule:
    - cron: '0 9 1 * *'   # 9:00 AM UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      bench_to_brain:
        description: 'Bench to Brain (leave blank to use LinkedIn API)'
        required: false
        default: ''
      atomic_ambition:
        description: 'Atomic Ambition'
        required: false
        default: ''
      signal_over_noise:
        description: 'Signal Over Noise'
        required: false
        default: ''
      science_tales:
        description: 'Science Tales'
        required: false
        default: ''
      rendered:
        description: 'Rendered'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-newsletters:
    runs-on: ubuntu-latest   # LinkedIn API works from any IP — no self-hosted runner needed

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch subscriber counts and update HTML
        env:
          LINKEDIN_ACCESS_TOKEN:  ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID:     ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          COUNT_BENCH_TO_BRAIN:   ${{ github.event.inputs.bench_to_brain }}
          COUNT_ATOMIC_AMBITION:  ${{ github.event.inputs.atomic_ambition }}
          COUNT_SIGNAL_OVER_NOISE: ${{ github.event.inputs.signal_over_noise }}
          COUNT_SCIENCE_TALES:    ${{ github.event.inputs.science_tales }}
          COUNT_RENDERED:         ${{ github.event.inputs.rendered }}
        run: python3 .github/scripts/update_newsletter_stats.py

      - name: Commit and push if counts changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes — subscriber counts are already up to date."
          else
            git add index.html
            git commit -m "chore: update newsletter subscriber counts [automated $(date +%Y-%m-%d)]"
            git push
            echo "Counts updated and deployed."
          fi
